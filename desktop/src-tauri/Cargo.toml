[package]
name = "wsedit"
version = "0.1.0"
description = "wsedit desktop terminal deck"
authors = ["Nghia Trong Nguyen <noreply@anthropic.com>"]
edition = "2021"

[lib]
name = "wsedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
portable-pty = "0.8"
parking_lot = "0.12"
lazy_static = "1.4"
